# Nginx: the contents of this file REPLACE the whole server{} body; they are not
# appended to it.
#
# 1C-Bitrix configuration: blocks direct access to internal Bitrix directories
# and PHP execution inside upload/, raises upload body size, and routes SEF URLs
# through /bitrix/urlrewrite.php once Bitrix is installed.

include snippets/maintenance_mode.conf;

client_max_body_size 64m;

# Block internal Bitrix directories and PHP scripts inside upload/.
location ~* ^/(bitrix/(modules|local_cache|stack_cache|managed_cache|php_interface)|upload/.*\.php$) {
    deny all;
}

# Do not cache static assets during development.
location ~* \.(svg|png|jpe?g|gif|webp|avif|jxl|ico|tiff?|heic|css|js|mjs|map|webmanifest|wasm|json|jsonld|geojson|xml|txt|csv|pdf|eot|otf|ttf|ttc|woff2?|mp4|mov|webm|mpe?g|avi|ogv|mp3|wav|ogg|m4a|aac|mid|midi)$ {
    add_header Cache-Control "max-age=0, must-revalidate" always;
    try_files $uri =404;
}

index         index.php index.html index.htm;
fastcgi_index index.php;

location / {
    try_files $uri $uri/ @bitrix;
}

location @bitrix {
    if (-f $document_root/bitrix/urlrewrite.php) {
        rewrite ^(.*)$ /bitrix/urlrewrite.php last;
    }
    rewrite ^(.*)$ /index.php last;
}

location ~ \.php$ {
    fastcgi_pass $backend_ip:$backend_port;
    try_files    $fastcgi_script_name =404;
    include      fastcgi.conf;
    include      env/__DOMAIN__.conf;
}
