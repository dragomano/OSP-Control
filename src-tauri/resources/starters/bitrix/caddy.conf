# Caddy: the contents of this file REPLACE the whole site body; they are not
# appended to it.
#
# 1C-Bitrix host body: blocks internal directories and PHP execution in upload/,
# then routes requests through existing files, directory index.php,
# /bitrix/urlrewrite.php (once installed) or /index.php.

import common_host {host}
request_header X-Request-Id {http.request.uuid}

@bitrix_denied path_regexp ^/(bitrix/(modules|local_cache|stack_cache|managed_cache|php_interface)(/|$)|upload/.*\.php$)
respond @bitrix_denied 403

php_fastcgi {php_engine}:__PHP_PORT__ {
    env X_REQUEST_ID {http.request.uuid}
    import env_{host}
    import timeouts_config
    try_files {path} {path}/index.php /bitrix/urlrewrite.php /index.php
}

file_server
