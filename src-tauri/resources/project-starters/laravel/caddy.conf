# Caddy: the contents of this file REPLACE the whole site body; they are not
# appended to it. An empty file produces an empty site body.
# Therefore the complete host body is declared below:
#   - common_host  - logging, request body limit, security/cache headers,
#                    friendly errors, maintenance mode, hidden-file blocking;
#   - php_fastcgi  - single front controller: a request without a matching file
#                    is rewritten to /index.php (required for Laravel routes);
#   - file_server  - serves static files and public/ itself.
#
# PHP upstream: OSPanel substitutes {php_engine} with the project's PHP module
# name (for example PHP-8.5) and publishes the same alias in the hosts file
# (module alias -> its IP), so the PHP version follows php_engine.
# OSP Control snapshots the selected PHP module's active profile port at creation.
# Update the port below if the module or its port changes later.
#
# Do not import fastcgi_intercept_errors (unlike the stock host_php_sep
# template): it re-raises PHP 4xx/5xx as Caddy errors, so OSPanel error pages
# replace Laravel's own error pages (404/500).

import common_host {host}
request_header X-Request-Id {http.request.uuid}

php_fastcgi {php_engine}:__PHP_PORT__ {
    env X_REQUEST_ID {http.request.uuid}
    import env_{host}
    import timeouts_config
    try_files {path} /index.php
}

file_server
