# Nginx: the contents of this file REPLACE the whole server{} body; they are not
# appended to it. An empty file produces an empty body in which PHP is not
# handled at all (.php files are served as static, exposing PHP source).
# The complete body below includes maintenance mode, fallback routing,
# development cache headers, indexes and the PHP handler.
#
# Laravel front controller: the OSPanel fallback_redirect snippet forwards
# requests that do not match an existing file to index.php. Without it,
# Laravel routes (e.g. /login) return 404 from nginx.

include snippets/maintenance_mode.conf;
include snippets/fallback_redirect.conf;

# Do not cache static assets during development.
location ~* \.(svg|png|jpe?g|gif|webp|avif|jxl|ico|tiff?|heic|css|js|mjs|map|webmanifest|wasm|json|jsonld|geojson|xml|txt|csv|pdf|eot|otf|ttf|ttc|woff2?|mp4|mov|webm|mpe?g|avi|ogv|mp3|wav|ogg|m4a|aac|mid|midi)$ {
    add_header Cache-Control "max-age=0, must-revalidate" always;
    try_files $uri =404;
}

index         index.php index.html index.htm;
fastcgi_index index.php;

# PHP scripts go to the project's PHP engine.
# OSPanel writes $backend_ip / $backend_port into server{} from php_engine,
# so PHP version and port changes are picked up automatically.
location ~ \.php$ {
    fastcgi_pass $backend_ip:$backend_port;
    try_files    $fastcgi_script_name =404;
    include      fastcgi.conf;
    include      env/__DOMAIN__.conf;
}
