# Apache: the contents of this file are APPENDED to the end of the <VirtualHost>
# block; they do not replace it. Only VirtualHost / Directory level directives
# are allowed here.
#
# The file is intentionally left without directives: the stock Apache template
# (Host_PHP / Host_PHP_SSL) already sets DocumentRoot, AllowOverride All,
# DirectoryIndex and the PHP handler. WordPress pretty permalinks are handled
# by public/.htaccess and require mod_rewrite to be loaded.
# No extra directives are needed here with that setup.
#
# Keep comments in ASCII here. The Apache profile generates configs with
# encoding = ASCII (config/Apache/default/settings.ini, [httpd.conf]), so
# non-ASCII characters are re-encoded lossily when this file is copied to
# modules/Apache/conf/custom and break httpd.conf. Add your directives below.
